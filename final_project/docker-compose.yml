services:
  mongo:
    image: mongo:8
    container_name: fp-mongo-container

    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend

    container_name: fp-backend-container

    env_file:
      - ./backend/.env

    environment:
      MONGODB_URI: mongodb://mongo:27017

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend

    container_name: fp-frontend-container

    environment:
      VITE_BACKEND_URL: http://backend:3000

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

volumes:
  mongo_data:
